- defaults:
    link:
      relink: true
      force: true
      create: true
      glob: true

- clean: [
  "~",
  "~/.config/zsh/",
  "~/.local/bin/",
  "~/.config/tmux/",
  "~/.config/yazi/",
  ]

- link:
    ~/.bashrc: bash/.bashrc
    ~/.zshrc: zsh/.zshrc
    ~/.config/zsh/:
      path: zsh/*.zsh
    ~/.config/zsh/plugins:
      path: zsh/plugins
      glob: false
    ~/.tmux.conf: tmux/tmux.conf
    ~/.config/tmux/:
      path: tmux/**
      exclude: [tmux/tmux.conf]
    ~/.config/yazi/: yazi/**
    ~/.local/bin/: bin/**


- shell:
    - [git submodule update --init --recursive, Installing submodules]
