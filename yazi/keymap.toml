# Uppercase = Windows (WSL host) targets, lowercase = Linux targets.
# ponytail: Windows user hardcoded; WSL exposes no reliable env var for it.
[[mgr.prepend_keymap]]
on   = [ "g", "w" ]
run  = "cd ~/workspace"
desc = "Go to ~/workspace"

[[mgr.prepend_keymap]]
on   = [ "g", "H" ]
run  = "cd /mnt/c/Users/filippo.pirola.PL"
desc = "Go to Windows home"

[[mgr.prepend_keymap]]
on   = [ "g", "D" ]
run  = "cd /mnt/c/Users/filippo.pirola.PL/Downloads"
desc = "Go to Windows Downloads"

# Unbind default `g d` (~/Downloads) — unused on WSL.
[[mgr.prepend_keymap]]
on  = [ "g", "d" ]
run = "noop"

# `?` as a lazygit-style help alias (built-in `~` / <F1> still work).
[[mgr.prepend_keymap]]
on   = "?"
run  = "help"
desc = "Open help"
